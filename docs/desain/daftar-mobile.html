<!doctype html>
<!-- Acuan desain Ruang Informatika. Baca BACA-SAYA.md sebelum memakai file ini. -->
<html lang="id">
<head>
<meta charset="utf-8">
<title>Daftar Akun — Mobile</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F2}
a{color:#2347C4}a:hover{color:#1A3596}
:focus-visible{outline:3px solid #F2A93B;outline-offset:2px}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #15191F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: none; background: #15191F; color: #FFFFFF; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #2347C4; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 13px">{ }</span>
<span style="font-weight: 800; font-size: 15px">Ruang Informatika</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em">Buat akun</h1>
<p style="margin: 0; font-size: 14px; color: #C5CBD6">Sudah punya akun? <a href="#" style="color: #F2C27B; font-weight: 700">Masuk</a></p>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<div role="group" aria-label="Daftar sebagai" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px; border-radius: 14px; background: #F1F2EE">
<button type="button" aria-pressed="true" style="min-height: 44px; border-radius: 10px; border: 0; background: #FFFFFF; color: #15191F; font: inherit; font-size: 15px; font-weight: 700">Saya siswa</button>
<button type="button" aria-pressed="false" style="min-height: 44px; border-radius: 10px; border: 0; background: transparent; color: #4A515C; font: inherit; font-size: 15px; font-weight: 700">Saya guru</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-nama" style="font-size: 14px; font-weight: 700">Nama lengkap</label>
<input id="m-nama" type="text" autocomplete="name" placeholder="Sesuai data sekolah" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CDC4; font: inherit; font-size: 15px; color: #15191F; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-nisn" style="font-size: 14px; font-weight: 700">NISN</label>
<input id="m-nisn" type="text" inputmode="numeric" maxlength="10" placeholder="10 digit" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CDC4; font: inherit; font-size: 15px; color: #15191F; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-kode" style="font-size: 14px; font-weight: 700">Kode kelas</label>
<input id="m-kode" type="text" placeholder="XRPL1-7K2Q" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CDC4; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; color: #15191F; background: #FFFFFF">
<span style="font-size: 13px; color: #4A515C">Minta kode ini ke guru Informatika.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-email" style="font-size: 14px; font-weight: 700">Email</label>
<input id="m-email" type="email" autocomplete="email" placeholder="nama@email.com" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CDC4; font: inherit; font-size: 15px; color: #15191F; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-pass" style="font-size: 14px; font-weight: 700">Kata sandi</label>
<input id="m-pass" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CDC4; font: inherit; font-size: 15px; color: #15191F; background: #FFFFFF">
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #E8EDFC; color: #1A3596; font-size: 14px">
<span style="display: flex; margin-top: 1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg></span>
<span>Akun langsung aktif dan masuk ke kelas sesuai kode.</span>
</div>
</div>

<div style="flex: none; padding: 12px 20px 16px; border-top: 1px solid #E2E4DF; background: #FFFFFF">
<button type="button" style="width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: #2347C4; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Daftar sebagai siswa</button>
</div>
</div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
